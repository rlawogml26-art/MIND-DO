<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --gap: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          12px/1.5 Inter,
          "Noto Sans KR",
          system-ui,
          sans-serif;
        color: var(--figma-color-text, #222);
        background: var(--figma-color-bg, #fff);
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 14px;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--figma-color-text-secondary, #666);
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      input[type="text"] {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--figma-color-border, #ddd);
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--figma-color-border, #ddd);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--figma-color-bg-brand, #0d99ff);
        border-color: transparent;
        color: var(--figma-color-text-onbrand, #fff);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .tags {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px 6px;
      }
      .tags label {
        flex-direction: row;
        align-items: center;
        gap: 4px;
      }
      .muted {
        color: var(--figma-color-text-secondary, #666);
      }
      .issues {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .issues li {
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        cursor: pointer;
      }
      .issues li.error b {
        color: var(--figma-color-text-danger, #d22);
      }
      .issues li.warn b {
        color: var(--figma-color-text-warning, #b80);
      }
      .notice {
        min-height: 18px;
        white-space: pre-line;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>새 디자인</h2>
        <div class="row">
          <button id="blank" class="primary">가로 빈 틀 만들기</button>
          <button id="blank-vertical" class="primary">세로 빈 틀 만들기</button>
        </div>
        <p class="muted" style="margin: 0">
          티켓·폴라로이드·인생네컷·필름 중 하나인 페이지에서 눌러 주세요. 사진
          1~4장 판이 함께 만들어져요. 세로형은 위가 개인 쪽, 아래가 공동
          쪽이에요.
        </p>
        <button id="background">배경으로 깔기</button>
        <p class="muted" style="margin: 0">
          캔버스에 놓은 이미지를 고르고 누르면 4장 판 모두의 맨 아래에 깔려요.
        </p>
      </section>

      <p id="notice" class="notice muted"></p>

      <p id="none" class="muted" style="margin: 0">
        디자인(맨 바깥 프레임)이나 그 안의 레이어를 고르면 정보가 나와요.
      </p>

      <div id="form" hidden>
        <section>
          <h2>디자인 정보</h2>
          <label>이름 <input id="name" type="text" maxlength="20" /></label>
          <label
            >id (카테고리_디자인이름_번호, 영어 소문자·숫자·_)
            <input
              id="id"
              type="text"
              maxlength="40"
              placeholder="ticket_busan_01"
          /></label>
          <div class="row">
            <span>카테고리</span>
            <b id="category"></b>
            <span class="muted">(페이지 이름으로 정해져요)</span>
          </div>
          <label class="row" style="flex-direction: row"
            >대표 색 <input id="mainColor" type="color"
          /></label>
          <span>분위기 태그 (1~5개)</span>
          <div id="tags" class="tags"></div>
        </section>

        <section>
          <h2>이름 붙이기 (고른 레이어에)</h2>
          <div class="row">
            <button data-role="photo">사진 자리</button>
            <button data-role="title">제목</button>
            <button data-role="date">날짜</button>
            <button data-role="groupName">그룹명</button>
            <button data-role="participants">참여자</button>
            <button data-role="static">고정 글자</button>
          </div>
        </section>

        <section>
          <h2>검사·내보내기</h2>
          <div class="row">
            <button id="check">검사</button>
            <button id="export" class="primary">내보내기</button>
          </div>
          <ul id="issues" class="issues"></ul>
        </section>
      </div>
    </main>
    <!-- UI_SCRIPT -->
  </body>
</html>
